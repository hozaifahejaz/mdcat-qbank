name: Attach custom domain (one-off)

on:
  push:
    branches: [claude/project-thread-uhqdf4]
    paths: [".github/workflows/attach-domain.yml"]

jobs:
  attach:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: mdcat-qbank
    steps:
      - name: Attach
        run: |
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          B=https://api.cloudflare.com/client/v4
          echo "== token"; api $B/user/tokens/verify | jq -c '{success, status: .result.status, errors}'
          echo "== zones"; api "$B/zones?name=markhorprep.com" | jq -c '{success, errors, zones: [.result[]? | {name, status, plan: .plan.name}]}'
          api "$B/zones?name=markhorprep.pk" | jq -c '{success, errors, zones: [.result[]? | {name, status}]}'
          ZONE=$(api "$B/zones?name=markhorprep.com" | jq -r '.result[0].id // empty')
          echo "== pages domains before"; api $B/accounts/$ACCOUNT/pages/projects/$PROJECT/domains | jq -c '{success, errors, d: [.result[]? | {name, status}]}'
          for d in markhorprep.com www.markhorprep.com; do
            echo "== add pages domain $d"; api -X POST $B/accounts/$ACCOUNT/pages/projects/$PROJECT/domains -d "{\"name\":\"$d\"}" | jq -c '{success, errors, r: (.result | {name, status}?)}'
          done
          if [ -n "$ZONE" ]; then
            echo "== dns before"; api "$B/zones/$ZONE/dns_records?per_page=100" | jq -c '{success, errors, r: [.result[]? | {type, name, content, proxied}]}'
            for n in markhorprep.com www.markhorprep.com; do
              have=$(api "$B/zones/$ZONE/dns_records?name=$n" | jq '.result | length')
              if [ "$have" = "0" ]; then
                echo "== create CNAME $n"; api -X POST $B/zones/$ZONE/dns_records -d "{\"type\":\"CNAME\",\"name\":\"$n\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true}" | jq -c '{success, errors}'
              else echo "== $n already has $have record(s), left alone"; fi
            done
            echo "== redirect rules before"; R=$(api $B/zones/$ZONE/rulesets/phases/http_request_dynamic_redirect/entrypoint); echo "$R" | jq -c '{success, errors, rules: [.result.rules[]? | .description]}'
            if [ "$(echo "$R" | jq '.result.rules // [] | length')" = "0" ]; then
              echo "== create www redirect"
              api -X PUT $B/zones/$ZONE/rulesets/phases/http_request_dynamic_redirect/entrypoint -d '{"rules":[{"description":"www to apex","expression":"(http.host eq \"www.markhorprep.com\")","action":"redirect","action_parameters":{"from_value":{"status_code":301,"target_url":{"expression":"concat(\"https://markhorprep.com\", http.request.uri.path)"},"preserve_query_string":true}}}]}' | jq -c '{success, errors}'
            fi
            echo "== ssl mode"; api $B/zones/$ZONE/settings/ssl | jq -c '{success, errors, v: .result.value}'
            echo "== always https"; api -X PATCH $B/zones/$ZONE/settings/always_use_https -d '{"value":"on"}' | jq -c '{success, errors, v: .result.value}'
          fi
          sleep 30
          echo "== pages domains after"; api $B/accounts/$ACCOUNT/pages/projects/$PROJECT/domains | jq -c '{success, errors, d: [.result[]? | {name, status, v: .validation_data.status, ve: .verification_data.status}]}'
