name: Android app

# Builds and tests the Android app in android/ whenever it changes. The debug APK is kept as a download on the run's
# page for trying on a phone, with the screen images from the screenshot tests.
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug -Proborazzi.test.record=true --stacktrace
      - name: Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: markhor-prep-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Screen images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: android/app/build/outputs/roborazzi/
          if-no-files-found: ignore
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/tests/
          if-no-files-found: ignore
