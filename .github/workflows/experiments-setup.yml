name: Experiments site setup (one-off)

on:
  push:
    branches: [claude/project-thread-nyq77y]
    paths: [.github/workflows/experiments-setup.yml]

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: experiments-database
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Attach experiments.markhorprep.com to the experiments branch
        run: |
          API=https://api.cloudflare.com/client/v4
          H=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          curl -sS "${H[@]}" -X POST "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/mdcat-qbank/domains" \
            --data '{"name":"experiments.markhorprep.com"}' | jq -c '{success, errors, status: .result.status}'
          ZONE=$(curl -sS "${H[@]}" "$API/zones?name=markhorprep.com" | jq -r '.result[0].id')
          REC=$(curl -sS "${H[@]}" "$API/zones/$ZONE/dns_records?name=experiments.markhorprep.com" | jq -r '.result[0].id // empty')
          BODY='{"type":"CNAME","name":"experiments","content":"experiments.mdcat-qbank.pages.dev","proxied":true,"comment":"Experiments site (experiments branch)"}'
          if [ -n "$REC" ]; then
            curl -sS "${H[@]}" -X PUT "$API/zones/$ZONE/dns_records/$REC" --data "$BODY" | jq -c '{success, errors, content: .result.content}'
          else
            curl -sS "${H[@]}" -X POST "$API/zones/$ZONE/dns_records" --data "$BODY" | jq -c '{success, errors, content: .result.content}'
          fi
          sleep 20
          curl -sS "${H[@]}" "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/mdcat-qbank/domains/experiments.markhorprep.com" | jq -c '.result | {status, verification_data, validation_data}'
      - run: scripts/copy-live-db.sh
      - run: npx wrangler d1 migrations apply mdcat-qbank-experiments --remote --env preview
      - name: Check the copy
        run: npx wrangler d1 execute mdcat-qbank-experiments --remote --env preview --command "SELECT (SELECT COUNT(*) FROM questions) AS questions, (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM d1_migrations) AS migrations"
