name: Deploy to Cloudflare Pages

# main goes to production. Any other branch gets its own preview at <branch>.mdcat-qbank.pages.dev; the experiments
# branch is also served at experiments.markhorprep.com (docs/experiments-site.md). Previews use the experiments copy
# of the database (wrangler.toml [env.preview]) and are kept out of search engines.
on:
  push:
    # The Android app has its own workflow (android.yml); a push that only changes it leaves the site alone.
    paths-ignore:
      - "android/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Branch deploys write to the experiments database, as does experiments-db.yml: one at a time.
    concurrency:
      group: ${{ github.ref_name == 'main' && 'deploy-main' || 'experiments-database' }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the Cloudflare settings are there
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - name: Create Pages project if missing
        run: npx wrangler pages project create mdcat-qbank --production-branch=main || true
      # Database changes in migrations/ go to the D1 database before the new code: main to the live database, any
      # other branch to the experiments copy. Needs the API token to have "D1: Edit" (docs/auth-setup.md); if it
      # doesn't, the site still deploys and this step shows the error.
      - name: Apply database migrations
        id: migrate
        continue-on-error: true
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            npx wrangler d1 migrations apply mdcat-qbank-eu --remote
          else
            npx wrangler d1 migrations apply mdcat-qbank-experiments --remote --env preview
          fi
      # A preview is a copy of the site on another address. Search engines must never list it, or it would compete
      # with markhorprep.com: no robots access, no sitemap, and a noindex header on every page.
      - name: Keep previews out of search engines
        if: github.ref_name != 'main'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > out/robots.txt
          rm -f out/sitemap.xml out/urls.txt
          printf '\n/*\n  X-Robots-Tag: noindex, nofollow\n' >> out/_headers
      # Before the deploy, note whether the list of public pages differs from the one that is live.
      - name: Compare the page list with the live one
        if: github.ref_name == 'main'
        id: pages
        continue-on-error: true
        run: |
          curl -fsS --max-time 20 https://markhorprep.com/sitemap.xml -o live-sitemap.xml || true
          if cmp -s live-sitemap.xml out/sitemap.xml; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy
        run: npx wrangler pages deploy --project-name=mdcat-qbank --branch="${GITHUB_REF_NAME}" --commit-dirty=true
      # IndexNow: tells Bing and the other search engines that take part which pages to read again, so new and
      # changed pages show up in hours instead of days. The key is public by design (public/<key>.txt proves the
      # site sent it). Only when the page list changed, and never fails the deploy.
      - name: Tell search engines the pages changed
        if: github.ref_name == 'main' && steps.pages.outputs.changed == 'true'
        continue-on-error: true
        run: |
          node -e '
            const urls = require("fs").readFileSync("out/urls.txt", "utf8").trim().split("\n");
            const key = "12023f8437abe7d0dad51076e6c30e94";
            fetch("https://api.indexnow.org/indexnow", {
              method: "POST", headers: { "content-type": "application/json; charset=utf-8" },
              body: JSON.stringify({ host: "markhorprep.com", key, keyLocation: `https://markhorprep.com/${key}.txt`, urlList: urls }),
            }).then((r) => console.log("IndexNow:", r.status, urls.length, "pages"));
          '
      # The site deploys even when the database step fails, so that a small fix is never held back. This last step
      # then turns the run red, so the failure is seen and the missing database change is applied by hand.
      - name: Fail the run if the database changes did not apply
        if: steps.migrate.outcome == 'failure'
        run: |
          echo "Database migrations failed. Apply them with: npx wrangler d1 migrations apply mdcat-qbank-eu --remote (main) or npx wrangler d1 migrations apply mdcat-qbank-experiments --remote --env preview (other branches)"
          exit 1
