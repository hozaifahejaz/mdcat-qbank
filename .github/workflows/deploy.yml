name: Deploy to Cloudflare Pages

# main goes to production. Any other branch gets its own preview at <branch>.mdcat-qbank.pages.dev.
on:
  push:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Check the Cloudflare settings are there
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - name: Create Pages project if missing
        run: npx wrangler pages project create mdcat-qbank --production-branch=main || true
      # Database changes in migrations/ go to the D1 database before the new code. Main only, since branch
      # previews share the same database. Needs the API token to have "D1: Edit" (docs/auth-setup.md); if it
      # doesn't, the site still deploys and this step shows the error.
      - name: Apply database migrations
        if: github.ref_name == 'main'
        continue-on-error: true
        run: npx wrangler d1 migrations apply mdcat-qbank --remote
      - name: Deploy
        run: npx wrangler pages deploy --project-name=mdcat-qbank --branch="${GITHUB_REF_NAME}" --commit-dirty=true
