name: Copy the database to Frankfurt (one-off)
on:
  push:
    branches: [claude/project-thread-gexmty]
    paths: [".github/workflows/move-database.yml"]
jobs:
  copy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Describe both databases
        run: |
          cat > move.toml <<'T'
          name = "mdcat-qbank-move"
          compatibility_date = "2026-10-01"
          [[d1_databases]]
          binding = "OLD"
          database_name = "mdcat-qbank"
          database_id = "f909e867-fab8-4834-a715-e9dc75b3a4af"
          [[d1_databases]]
          binding = "NEW"
          database_name = "mdcat-qbank-eu"
          database_id = "787e5d79-1435-4a72-a374-2ce59f57fdaf"
          T
      - name: Export from Tokyo
        run: |
          echo "export started at $(date -u +%Y-%m-%dT%H:%M:%SZ) = $(date -u +%s)000 ms"
          npx wrangler d1 export mdcat-qbank --remote --config move.toml --output dump.sql
          ls -la dump.sql
          grep -c "^INSERT" dump.sql || true
          grep -E "^CREATE (TABLE|VIEW|INDEX|UNIQUE INDEX|TRIGGER)" dump.sql | cut -c1-80
      - name: Import into Frankfurt
        run: npx wrangler d1 execute mdcat-qbank-eu --remote --config move.toml --file dump.sql --yes
      - name: Count rows in both
        run: |
          for db in mdcat-qbank mdcat-qbank-eu; do
            echo "== $db"
            npx wrangler d1 execute $db --remote --config move.toml --json --command "SELECT type, count(*) AS n FROM sqlite_master WHERE name NOT LIKE '_cf_%' GROUP BY type" | tr -d '\n' | head -c 600; echo
          done
