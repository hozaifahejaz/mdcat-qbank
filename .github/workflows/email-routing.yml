name: Email routing (one-off)

on:
  push:
    branches: [claude/project-thread-yryvug]
    paths: [".github/workflows/email-routing.yml"]

jobs:
  routing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      DOMAIN: markhorprep.com
    steps:
      - name: Run
        run: |
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          B=https://api.cloudflare.com/client/v4
          ZONE=$(api "$B/zones?name=$DOMAIN" | jq -r '.result[0].id')
          echo "== dns records"; api "$B/zones/$ZONE/dns_records?per_page=100" | jq -c '.result[]? | {type, name, content, priority}'
          echo "== routing settings"; api $B/zones/$ZONE/email/routing | jq -c '{success, errors, r: .result}'
          echo "== routing dns"; api $B/zones/$ZONE/email/routing/dns | jq -c '{success, errors, r: .result}'
          echo "== routing rules"; api $B/zones/$ZONE/email/routing/rules | jq -c '{success, errors, r: .result}'
          echo "== destination addresses"; api $B/accounts/$ACCOUNT/email/routing/addresses | jq -c '{success, errors, r: [.result[]? | {email, verified}]}'
