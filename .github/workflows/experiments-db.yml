name: Copy live database to experiments

# Run by hand (Actions > Copy live database to experiments > Run workflow, branch "experiments") when the experiments
# site should get the live questions and accounts again. It replaces everything in the experiments database (live is
# only read), then applies the chosen branch's own database changes on top.
on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    # One job at a time writes to the experiments database (deploy.yml uses the same group for branch deploys).
    concurrency:
      group: experiments-database
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: scripts/copy-live-db.sh
      - run: npx wrangler d1 migrations apply mdcat-qbank-experiments --remote --env preview
