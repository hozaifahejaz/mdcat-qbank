# Cloudflare Pages project. The static site is in out/ (next build); the sign-in API is in functions/,
# with shared server code in server/. Secrets (Google, Apple, SMS, email, Turnstile) are set in the
# Cloudflare dashboard, never here: see docs/auth-setup.md.
name = "mdcat-qbank"
pages_build_output_dir = "out"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "mdcat-qbank-eu"
database_id = "3e787d4c-b8ab-4326-93b1-e05f151c8d4a"
migrations_dir = "migrations"

# Run the API next to the database rather than next to the visitor: each request makes a few database calls, and
# each one is a round trip, so the code and the database must sit together. Where they sit is chosen by how fast
# Pakistan reaches it. Measured from Cloudflare's Karachi site in November 2026, per API request: Frankfurt about
# 190 ms, US East 365, Hong Kong 420, Tokyo 450, London 475. So the database (mdcat-qbank-eu, Eastern Europe hint,
# served from Frankfurt) and the code are both in Frankfurt. The earlier database in Tokyo (mdcat-qbank,
# f909e867-fab8-4834-a715-e9dc75b3a4af) is kept untouched as a fallback. "smart" mode never moved the code, so the
# place is named outright: the Cloudflare site nearest AWS's Frankfurt region.
[placement]
region = "aws:eu-central-1"

# Every deploy that is not main (the experiments site at experiments.markhorprep.com, and any other branch) uses its
# own copy of the database, so trying something there can never touch real accounts or answers. Refresh the copy from
# the live one with the "Copy live database to experiments" workflow (docs/experiments-site.md).
[[env.preview.d1_databases]]
binding = "DB"
database_name = "mdcat-qbank-experiments"
database_id = "e5e57138-f221-43a3-9e1e-e423b4be5040"
migrations_dir = "migrations"
