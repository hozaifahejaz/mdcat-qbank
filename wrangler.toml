# Cloudflare Pages project. The static site is in out/ (next build); the sign-in API is in functions/,
# with shared server code in server/. Secrets (Google, Apple, SMS, email, Turnstile) are set in the
# Cloudflare dashboard, never here: see docs/auth-setup.md.
name = "mdcat-qbank"
pages_build_output_dir = "out"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "mdcat-qbank"
database_id = "f909e867-fab8-4834-a715-e9dc75b3a4af"
migrations_dir = "migrations"

# Run the API next to the database rather than next to the visitor: each request makes a few database calls, and
# each one is a round trip. The database's main copy is in Tokyo (D1 answers with served_by_colo = NRT), while
# visitors from Pakistan arrive in Singapore, about 80 ms away per call. "smart" mode never moved the code (answers
# said cf-placement: local-SIN), so the place is named outright: the Cloudflare site nearest AWS's Tokyo region.
[placement]
region = "aws:ap-northeast-1"
